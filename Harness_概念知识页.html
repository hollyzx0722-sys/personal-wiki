<script>
const base='Harness_概念知识页.html#';
const pages={
  'harness':{name:'Harness',label:'概念 · 工程 · 当代',lede:'让模型在真实世界里稳定干活的整套运行环境：上下文、工具、执行环境、审批、会话状态，以及把它们串成工作回路的规则。',tags:['概念','工程','当代','已整理'],facts:[['英文','Harness'],['对象类型','概念 / Agent 运行时'],['核心命题','模型之外的一切'],['文章中的比喻','带好一个天才实习生']],story:[['它解决什么问题','模型会思考，但没有项目背景、工具、边界感和持续记忆。Harness 把这些缺口补成一套可执行的环境。'],['为什么现在重要','当模型能力趋同，差异会下沉到“怎么把模型用好”：能否看对资料、调用正确工具、在安全边界内执行，并留下可追溯的状态。'],['一条工作回路','上下文 → 工具 → 执行环境 → 审批 → 会话状态，循环往复，直到任务交付。']],related:['上下文管理','工具调用','执行环境与沙箱','审批与权限','会话与状态','Agent Loop','Codex','DeepSeek'],caveat:'文章把 Harness 概括为“模型之外的一切”，这是解释性定义，不是所有产品都采用的唯一术语边界。',questions:['Harness 与 Agent 框架的边界在哪里？','如何为自己的工作项目设计最小 Harness？','哪些规则应该交给系统，哪些必须由人确认？']},
  '上下文管理':{name:'上下文管理',label:'概念 · 工程 · 当代',lede:'决定模型在每一轮任务中看什么、不看什么，以及如何在对话变长时压缩、检索和更新信息。',tags:['概念','工程','当代','已整理'],facts:[['英文','Context Management'],['核心对象','任务相关资料与历史状态'],['关键动作','选择、注入、压缩、更新'],['直接影响','回答相关性、成本与稳定性']],story:[['选择相关信息','不能把全部资料一次性倒给模型，也不能只给一句“你自己看”。应先挑出与任务相关的文档、规则和决策。'],['让知识随手可得','文章强调“看不到的东西就等于不存在”：目录、决策记录和结构化知识库要放在模型能够访问的地方。'],['持续维护','随着会话变长，旧信息需要压缩或移出；过时规则要被更新，否则模型会沿用错误背景。']],related:['Harness','上下文注入','会话与状态','知识可见性','会话日志'],caveat:'上下文窗口大小、压缩策略和检索范围依赖具体模型与产品实现，本文没有给出统一参数。',questions:['怎样判断一份资料是否应该注入上下文？','上下文压缩会丢失哪些信息？','个人百科如何把页面关系转成可检索上下文？']},
  '工具调用':{name:'工具调用',label:'概念 · 工程 · 当代',lede:'让模型从“能想”走向“能做”的能力层，包括文件、命令、接口、数据库和其他外部系统。',tags:['概念','工程','当代','已整理'],facts:[['英文','Tool Calling / Tool Use'],['典型工具','文件读写、命令执行、API、数据库'],['作用','把计划落到现实世界'],['风险','越权、误操作、工具失败']],story:[['给模型手脚','文章用实习生比喻说明：不会打开文件、运行程序、查数据库的模型，必须通过工具才能执行任务。'],['工具不是无限授权','工具要和审批、权限、沙箱一起设计。能读资料不代表能改生产代码，能运行测试不代表能发布上线。'],['结果需要验证','工具调用完成不等于任务正确完成，执行结果应回到上下文中，由模型或人继续检查。']],related:['Harness','执行环境与沙箱','审批与权限','Agent Loop','Codex'],caveat:'工具调用的具体协议和接口形式因产品而异，文章主要从运行时职责解释它。',questions:['工具描述如何写才不容易被误用？','哪些工具适合自动执行，哪些需要审批？','如何记录每次工具调用以便复盘？']},
  '执行环境与沙箱':{name:'执行环境与沙箱',label:'概念 · 工程 · 当代',lede:'给模型一块隔离、可恢复的工作空间，让它可以试错而不直接影响正式环境。',tags:['概念','工程','当代','已整理'],facts:[['英文','Execution Environment / Sandbox'],['核心目标','隔离风险、允许试错'],['典型实现','开发分支、容器、测试环境'],['关联指标','可恢复性、权限边界、资源限制']],story:[['先给试验田','文章建议不要让“实习生”直接在正式环境里工作，而应提供独立分支或隔离测试环境。'],['安全边界','沙箱限制文件、网络、进程和资源的可见范围；审批则决定哪些高风险动作必须暂停。两者是互补关系。'],['失败可恢复','好的执行环境允许清理、回滚和重试，让模型可以验证方案，而不是一次失误就造成不可逆影响。']],related:['Harness','工具调用','审批与权限','会话与状态','Codex'],caveat:'“沙箱”可能指容器、虚拟机、权限剥离或远端执行环境，不能仅凭名称判断隔离强度。',questions:['个人工作项目需要多强的沙箱？','如何验证沙箱真的隔离了网络和敏感文件？','失败后怎样保留现场并安全重试？']},
  '审批与权限':{name:'审批与权限',label:'概念 · 工程 · 当代',lede:'把“模型可以自动做什么、必须询问什么、绝对不能做什么”明确成可执行的边界。',tags:['概念','工程','当代','已整理'],facts:[['英文','Approvals & Permissions'],['权限层级','自动放行 / 需确认 / 禁止'],['保护对象','数据、代码、生产环境、外部沟通'],['关联能力','工具调用、沙箱、审计']],story:[['把权限地图写出来','文章用“绿灯、红灯”说明：整理需求可以自动放行，正式同步排期或修改生产环境则应等待确认。'],['审批是工作流节点','审批不是一句口头提醒，而是 Agent Loop 中可以暂停、记录、恢复的状态。'],['控制接管成本','清晰的默认权限减少无意义的弹窗，同时让真正高风险的动作在边界前停下。']],related:['Harness','工具调用','执行环境与沙箱','会话与状态','Agent Loop'],caveat:'实际权限策略需要结合组织合规、数据分级和最小权限原则，文章没有替代安全评审。',questions:['如何给个人知识库设计最小权限？','审批记录应保留哪些字段？','怎样减少过度审批造成的工作中断？']},
  '会话与状态':{name:'会话与状态',label:'概念 · 工程 · 当代',lede:'让 Agent 跨轮次记住进展、失败位置和已验证结论，并能在中断后从正确的位置恢复。',tags:['概念','工程','当代','已整理'],facts:[['英文','Session & State'],['文章原语','Thread · Turn · Item'],['核心能力','记录、追溯、恢复'],['价值','把黑盒工作变成可检查的过程']],story:[['三层结构','会话是从开工到收工的完整任务；回合是一次交代、执行和回复；条目是回合中的具体事件。'],['随时回看','有了条目级日志，可以插入审批、回头查报价逻辑，或只过滤“改过哪些数字”这类事件。'],['失败后续上','状态记录当前步骤、试过但失败的方向和下一步，避免每次都从空白屏幕重新开始。']],related:['Harness','上下文管理','会话日志','审批与权限','Agent Loop','Codex'],caveat:'Thread、Turn、Item 是文章引用的 OpenAI 运行时原语，其他产品可能采用不同命名。',questions:['会话状态和长期记忆有什么区别？','什么事件应该进入条目日志？','如何让个人百科从对话自动生成可追溯状态？']},
  'Agent Loop':{name:'Agent Loop',label:'概念 · 工程 · 当代',lede:'Agent 持续观察上下文、选择动作、调用工具、检查结果并决定下一步的循环。',tags:['概念','工程','当代','已整理'],facts:[['中文','智能体循环'],['基本循环','理解 → 计划 → 执行 → 观察 → 修正'],['依赖','模型、工具、环境、状态、审批'],['文章观点','运行时的核心可替换层']],story:[['不是一次回答','普通问答往往是一问一答；Agent Loop 会把任务拆成多个动作，直到达到完成条件或遇到需要人确认的边界。'],['循环需要护栏','上下文决定看什么，工具决定能做什么，沙箱决定在哪做，审批决定何时停，状态决定下次从哪里接着做。'],['开放程度不同','文章称 DeepSeek 公开到 Agent Loop，而 Codex 更强调把已经校准的工作回路通过 CLI、app-server 和 SDK 接出去。']],related:['Harness','模型','工具调用','审批与权限','会话与状态','Codex','DeepSeek'],caveat:'Agent Loop 是文章中的工程概念；不同框架可能把规划、反思或验证拆成不同的循环。',questions:['一个可靠的 Agent Loop 最少需要哪些状态？','何时应该结束循环而不是继续尝试？','怎样把人的判断嵌入循环而不拖慢全部任务？']},
  'Codex':{name:'Codex',label:'人物/产品 · 工程 · 当代',lede:'文章中代表“向外开放接入面”的 Harness 路线：把调校好的工作回路通过 CLI、app-server 和 SDK 接入更多产品。',tags:['概念','工程','当代','待补充原典'],facts:[['对象类型','产品 / Agent 运行时'],['文章提到','Codex exec、app-server、官方 SDK'],['开放方向','向外：扩大接入面'],['一句话归纳','卖省心']],story:[['三种接入方式','Codex exec 适合人直接指挥；app-server 提供标准接口；SDK 让内部程序自动创建会话、派发任务并接收进度。'],['默认路径','文章认为 Codex 的优势在于工作回路已经被反复校准，普通团队无需重新设计全部上下文、验证和恢复流程。'],['代价','接入更省心，也意味着 Agent 内部思考方式和运行时零件未必都能自由替换。']],related:['Harness','Agent Loop','CLI','app-server','SDK','DeepSeek'],caveat:'本页依据知识库文章整理，具体开源范围、版本和许可证应以 OpenAI 官方仓库与文档为准。',questions:['Codex app-server 的会话原语如何设计？','SDK 接入时如何处理审批和中断？','“省心”与可控性如何同时做到？']},
  'DeepSeek':{name:'DeepSeek',label:'人物/产品 · 工程 · 当代',lede:'文章中代表“向下开放运行时”的 Harness 路线：把 Agent Loop、模型适配、工具注册和会话日志拆成可组合的零件。',tags:['概念','工程','当代','待补充原典'],facts:[['对象类型','产品 / Agent 运行时'],['文章提到','DeepSeek Harness、插件树'],['开放方向','向下：组合控制权'],['一句话归纳','卖主权']],story:[['一棵插件树','文章把 DeepSeek 描述为启动时组装的插件树，模型适配器、工具注册表、会话日志和 Agent Loop 都可以替换。'],['组合权','团队可以根据自己的模型、执行环境、检索和子 Agent 需求拼装运行时，避免被单一产品的默认路径永久锁定。'],['代价','选择和控制权越多，越需要团队自己校准默认值、补齐工程治理，并承担维护成本。']],related:['Harness','Agent Loop','模型','插件树','Codex','模型 Provider'],caveat:'本页只提取文章中的比较框架，不对 DeepSeek 官方实现细节作超出原文的断言。',questions:['插件化 Harness 的最小组件边界是什么？','如何维护一套可替换但不失控的默认配置？','哪些能力值得自己掌控，哪些适合直接复用？']},
  'Codex与DeepSeek':{name:'Codex 与 DeepSeek',label:'概念 · 工程 · 当代',lede:'不是“谁更开放”的二选一，而是两种开放方向：Codex 向外扩展接入面，DeepSeek 向下开放运行时零件。',tags:['概念','工程','当代','待考证'],facts:[['比较维度','Harness 的开放层次'],['Codex','CLI + app-server + SDK，偏省心'],['DeepSeek','Agent Loop + 插件树，偏主权'],['共同点','都把竞争从模型推向模型之外']],story:[['同一个词，不同层次','两者都谈 Harness，但 Codex 公开的是“怎么把能力接进你的产品”，DeepSeek 公开的是“怎么把整套系统拆开重组”。'],['选择逻辑','想尽快见效的小团队更在意少接管；建设公司级 Agent 平台的团队更在意关键能力可替换。'],['真正护城河','功能清单可能趋同，没人下令时默认怎么做、是否先复现和验证，才是难以复制的隐性经验。']],related:['Harness','Codex','DeepSeek','Agent Loop','默认路径','隐性经验'],caveat:'这是知识库文章的解释框架，不等同于两家公司完整产品线、许可证或商业模式的全面比较。',questions:['“向外开放”和“向下开放”能否组合？','如何评估团队更需要省心还是主权？','默认路径应该怎样用数据持续校准？']}
};
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
